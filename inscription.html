<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription & Réservation — Cabanature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🌿 Cabanature</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="cours.html">Nos Ateliers</a>
      <a href="inscription.html" class="active">Réservation</a>
    </nav>
  </header>

  <main class="booking-container">
    <h1>Réservation d'un atelier</h1>
    <p>Choisissez votre atelier, votre date et remplissez vos informations pour réserver votre place.</p>

    <div class="form-card">
      <form id="registrationForm">
        
        <!-- Sélecteur de Cours Dynamique -->
        <div class="form-group">
          <label for="courseSelect">1. Choisissez un atelier *</label>
          <select id="courseSelect" required>
            <option value="">Chargement des ateliers...</option>
          </select>
        </div>

        <!-- Nombre de participants -->
        <div class="form-group">
          <label for="participants">2. Nombre de participants *</label>
          <select id="participants" required>
            <option value="1">1 personne</option>
            <option value="2">2 personnes</option>
            <option value="3">3 personnes</option>
            <option value="4">4 personnes</option>
          </select>
        </div>

        <!-- Calendrier Dynamique -->
        <div class="form-group">
          <label>3. Choisissez une date disponible *</label>
          <div class="calendar-wrapper">
            <div class="calendar-header">
              <strong id="monthYearTitle">Octobre 2026</strong>
            </div>
            <div class="calendar-grid" id="calendarGrid">
              <!-- Rempli en JS -->
            </div>
          </div>
          <input type="hidden" id="selectedDateInput" required>
        </div>

        <!-- Coordonnées -->
        <h3>4. Vos Coordonnées</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom *</label>
            <input type="text" id="firstName" placeholder="Jean" required>
          </div>
          <div class="form-group">
            <label for="lastName">Nom *</label>
            <input type="text" id="lastName" placeholder="Dupont" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Adresse E-mail *</label>
            <input type="email" id="email" placeholder="jean.dupont@exemple.fr" required>
          </div>
          <div class="form-group">
            <label for="phone">Numéro de téléphone *</label>
            <input type="tel" id="phone" placeholder="06 12 34 56 78" required>
          </div>
        </div>

        <!-- Récapitulatif du prix -->
        <div class="price-summary" id="priceSummary">
          Total : 0 €
        </div>

        <!-- Bouton Valider -->
        <button type="submit" class="btn-submit" id="submitBtn">Valider la réservation</button>

      </form>

      <!-- Message de confirmation ou erreur -->
      <div id="statusMessage" class="status-message"></div>
    </div>
  </main>

<script>
    const API_URL = window.ENV_API_URL || "https://elderly-albums-maintains-printed.trycloudflare.com";

    const courseSelect = document.getElementById('courseSelect');
    const participantsInput = document.getElementById('participants');
    const selectedDateInput = document.getElementById('selectedDateInput');
    const priceSummary = document.getElementById('priceSummary');
    const calendarGrid = document.getElementById('calendarGrid');
    const registrationForm = document.getElementById('registrationForm');
    const statusMessage = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');

    let coursesData = [];
    let bookedDates = {};

    // 1. Charger les cours depuis la BDD (/api/courses)
    async function loadCourses() {
      try {
        const response = await fetch(`${API_URL}/api/courses`);
        if (response.ok) {
          coursesData = await response.json();
          courseSelect.innerHTML = '';
          coursesData.forEach(course => {
            const option = document.createElement('option');
            option.value = course.id;
            option.setAttribute('data-price', course.price_per_person);
            option.setAttribute('data-capacity', course.max_capacity);
            option.textContent = `${course.title} (${course.price_per_person} €/pers)`;
            courseSelect.appendChild(option);
          });
          updatePrice();
          loadAvailability();
        }
      } catch (err) {
        console.error("Erreur chargement des cours :", err);
        courseSelect.innerHTML = '<option value="">Erreur de chargement des ateliers</option>';
      }
    }

    // 2. Calcul du prix total
    function updatePrice() {
      const selectedOption = courseSelect.options[courseSelect.selectedIndex];
      if (!selectedOption) return;
      const pricePerPerson = parseFloat(selectedOption.getAttribute('data-price')) || 0;
      const count = parseInt(participantsInput.value) || 1;
      const total = pricePerPerson * count;
      priceSummary.textContent = `Total : ${total} €`;
    }

    // 3. Charger les réservations pour ce cours (/api/availability/:courseId)
    async function loadAvailability() {
      const courseId = courseSelect.value;
      if (!courseId) return;
      try {
        const response = await fetch(`${API_URL}/api/availability/${courseId}`);
        if (response.ok) {
          const data = await response.json();
          bookedDates = {};
          data.forEach(item => {
            const dateStr = item.session_date.split('T')[0];
            bookedDates[dateStr] = item.booked_seats;
          });
        }
      } catch (err) {
        console.error("Erreur de chargement des disponibilités :", err);
      }
      renderCalendar();
    }

    // 4. Rendu du calendrier avec codes couleurs dynamiques (Vert / Rouge complet)
    function renderCalendar() {
      calendarGrid.innerHTML = '';
      const daysOfWeek = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
      
      daysOfWeek.forEach(day => {
        const div = document.createElement('div');
        div.className = 'calendar-day-head';
        div.textContent = day;
        calendarGrid.appendChild(div);
      });

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Récupérer la capacité max du cours sélectionné
      const selectedOption = courseSelect.options[courseSelect.selectedIndex];
      const maxCapacity = selectedOption ? parseInt(selectedOption.getAttribute('data-capacity')) || 8 : 8;
      const requestedParticipants = parseInt(participantsInput.value) || 1;

      for (let i = 1; i <= totalDays; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'calendar-day';

        const monthStr = String(month + 1).padStart(2, '0');
        const dayStr = String(i).padStart(2, '0');
        const dateFormatted = `${year}-${monthStr}-${dayStr}`;

        dayDiv.textContent = i;

        const seatsBooked = bookedDates[dateFormatted] || 0;
        const seatsRemaining = maxCapacity - seatsBooked;

        // Si la session dépasse la capacité max ou ne peut plus accueillir le nombre de participants demandés
        if (seatsBooked >= maxCapacity || seatsRemaining < requestedParticipants) {
          dayDiv.classList.add('full');
          dayDiv.title = seatsBooked >= maxCapacity ? 'Complet' : `Plus assez de places (${seatsRemaining} restante(s))`;
        } else {
          dayDiv.classList.add('available');
          dayDiv.title = `${seatsRemaining} place(s) restante(s)`;
          dayDiv.addEventListener('click', () => {
            document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('selected'));
            dayDiv.classList.add('selected');
            selectedDateInput.value = dateFormatted;
          });
        }

        if (selectedDateInput.value === dateFormatted) {
          dayDiv.classList.add('selected');
        }

        calendarGrid.appendChild(dayDiv);
      }
    }

    // 5. Validation et soumission du formulaire
    registrationForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!selectedDateInput.value) {
        alert("Veuillez cliquer sur une date disponible dans le calendrier.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Validation en cours...';
      statusMessage.style.display = 'none';

      const payload = {
        course_id: courseSelect.value,
        session_date: selectedDateInput.value,
        participants_count: parseInt(participantsInput.value),
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value
      };

      try {
        const response = await fetch(`${API_URL}/api/inscription`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok) {
          statusMessage.className = 'status-message success';
          statusMessage.innerHTML = `
            <strong>Réservation #${result.bookingId || 'réussie'} confirmée !</strong><br>
            Un e-mail de confirmation a été envoyé à <em>${payload.email}</em>.
          `;
          statusMessage.style.display = 'block';

          registrationForm.reset();
          selectedDateInput.value = '';
          loadAvailability();
          updatePrice();
        } else {
          throw new Error(result.error || 'Erreur lors de la réservation.');
        }
      } catch (err) {
        statusMessage.className = 'status-message error';
        statusMessage.textContent = err.message;
        statusMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Valider la réservation';
      }
    });

    courseSelect.addEventListener('change', () => {
      selectedDateInput.value = ''; // Reset la date si on change de cours
      updatePrice();
      loadAvailability();
    });

    participantsInput.addEventListener('change', () => {
      updatePrice();
      renderCalendar(); // Recalcule les disponibilités selon le nombre de participants
    });

    // Lancer le chargement initial
    loadCourses();
  </script>
</body>
</html>
